# Runs the Grok ACP PR's exact source commit on GitHub-hosted runners when
# this fork has no Depot runners. This workflow lives only on the validation
# branch; the product PR keeps the upstream runner configuration unchanged.
name: Grok ACP fork validation

on:
  push:
    branches:
      - ci/grok-acp-validation

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 63293a66db065a8269349d204ac05ca48c316e40
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      - run: cargo clippy -p ft-core -p ft-worker -p ft-server -p ft-cli --all-targets --locked -- -D warnings
      - run: cargo test -p ft-core --test normalise_acp --locked
      - run: cargo test -p ft-worker --test acp --locked

  clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, desktop, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: 63293a66db065a8269349d204ac05ca48c316e40
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ matrix.app }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - if: matrix.app != 'web'
        run: pnpm test
